<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var activeFetch = _rawFetch;

          // First define on Window.prototype so that assignment on window traverses prototype setter
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {}
          }

          // Also define on window instance if configurable
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        } catch (e) {}
      })();
    </script>
